name: Backend code checks

on:
  push:
    branches:
      - docs/team-readable-backend
  pull_request:

jobs:
  python-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install only dependencies needed by mocked tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi python-multipart pillow requests
      - name: Verify Python syntax without loading AI models
        run: python -m compileall -q backend tests experiments archive
      - name: Run offline backend workflow tests
        run: python -m unittest tests.test_backend_workflow -v
